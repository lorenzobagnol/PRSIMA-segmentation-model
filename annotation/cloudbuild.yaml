# gcloud builds submit annotation --config annotation/cloudbuild.yaml \
#   --substitutions _IMAGE=<region>-docker.pkg.dev/<project>/<repo>/annotation:latest
# Needs the Hugging Face token (with access to facebook/sam3) in Secret Manager as "hf-token".
steps:
  - id: weights
    name: python:3.12-slim
    entrypoint: bash
    secretEnv: [HF_TOKEN]
    args:
      - -c
      - |
        pip install -q huggingface_hub==1.32.0 &&
        HF_HOME=/workspace/weights python -c "from huggingface_hub import snapshot_download; snapshot_download('facebook/sam3')"
  - id: image
    name: gcr.io/cloud-builders/docker
    args: [build, -t, $_IMAGE, .]
  # Fails the build (so nothing is pushed) if a dependency the app needs at startup is missing.
  # Loads the processors and the model config offline, not the 3.4GB weights.
  - id: smoke-test
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint=python
      - $_IMAGE
      - -c
      - |
        import google.cloud.storage, fastapi, multipart, sam3_engine
        from transformers import Sam3Config, Sam3Processor, Sam3TrackerProcessor
        Sam3Processor.from_pretrained("facebook/sam3"); Sam3TrackerProcessor.from_pretrained("facebook/sam3"); Sam3Config.from_pretrained("facebook/sam3")
        print("smoke test ok")

images: [$_IMAGE]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/hf-token/versions/latest
      env: HF_TOKEN

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
timeout: 3600s
